[package]
name = "devrec"
version = "0.1.0"
edition = "2024"
description = "Deterministic, transactional development-record fragment engine"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
